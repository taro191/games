<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ท่านเศรษฐี</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{--page:#f1ebdd;--app:#fffaf0;--amber:#f2b54a;--card:#fff;--card2:#f6eedb;--line:#e6dcc0;--y:#ffc928;--hl:#b57600;--cy:#00b4d8;--cor:#ff6b57;--ink:#1d1d1d;--mut:#6e6757;--bi:#06303b;--pos:#0b8a52;--neg:#d3382f;--sheet:#fff;--dis:#e7e0cf;--disf:#9b9484;--tile:#fffaf0;--sp:#fff3d6;--sh:rgba(120,90,20,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--page:#141414;--app:#2f2f2f;--amber:#d99a35;--card:#3b3b3b;--card2:#4a4a4a;--line:#5a5a5a;--hl:#ffcc00;--ink:#f4f4f4;--mut:#bdbdbd;--sheet:#262626;--dis:#4a4a4a;--disf:#9c9c9c;--sp:#3b3b3b;--pos:#ffd84a;--neg:#ff8a7a;--sh:rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.5 Prompt,Sarabun,"Noto Sans Thai",system-ui,sans-serif;min-height:100dvh;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{position:relative;max-width:440px;margin:0 auto;min-height:100dvh;overflow:hidden;background:var(--app) radial-gradient(circle at 108% 104%,rgba(242,181,74,.2) 0 34%,transparent 35%)}
@media (min-width:480px){#app{margin:16px auto;min-height:calc(100dvh - 32px);border-radius:38px;box-shadow:0 20px 50px var(--sh)}}
.scr{display:flex;flex-direction:column;gap:14px;padding-bottom:96px}
.hero{position:relative;height:230px;background:var(--amber);overflow:hidden;flex:none}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:3}
.mas{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:170px;z-index:2}.mas svg{display:block;width:100%;height:auto}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:64px;z-index:1;fill:var(--app)}
.ttl{padding:0 24px}.sm{color:var(--hl);font-weight:600;font-size:18px}
h1{font:700 clamp(34px,11.5vw,46px)/1.05 Prompt,Sarabun,"Noto Sans Thai",system-ui,sans-serif;color:var(--ink);margin:0;word-break:break-word}
.ttl p{margin:10px 0 0;max-width:300px;font-size:15px;line-height:1.6;color:var(--mut)}
.box,.err,.note,.scr>button{margin:0 18px}.scr>button{flex:none}
.box{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 8px var(--sh);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;font:700 20px/1.3 Prompt,Sarabun,"Noto Sans Thai",system-ui,sans-serif}
.row,.seg{display:flex;gap:10px}.seg{gap:20px}.fbs{display:flex;gap:10px}
.tab{background:none;color:var(--mut);padding:4px 0;min-height:38px;flex:none;font-size:16px;border-radius:0;font-weight:600;box-shadow:none}
.tab.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--y)}
input{font:inherit;width:100%;padding:12px 18px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:54px;-webkit-user-select:text;user-select:text}
.row input{text-transform:uppercase;letter-spacing:4px;text-align:center}
button{font:600 16px Prompt,Sarabun,"Noto Sans Thai",system-ui,sans-serif;color:var(--bi);background:var(--cy);border:0;border-radius:16px;padding:10px 18px;min-height:50px;cursor:pointer;flex:1;transition:transform .1s;box-shadow:0 1px 3px rgba(0,0,0,.16)}
button:active{transform:scale(.96)}
button.alt{background:var(--y);color:#1d1d1d}
button.alt2{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
button:disabled,button.alt:disabled{background:var(--dis);color:var(--disf);box-shadow:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.mut{color:var(--mut);font-size:14px}.err{color:var(--neg);text-align:center;font-weight:700}.note{text-align:center;color:var(--mut)}
button.av{width:46px;min-height:46px;padding:0;flex:none;font-size:22px;background:#fff;color:#1d1d1d;border-radius:50%;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.pill2{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink);min-height:52px;padding:0 22px;font-size:16px;box-shadow:0 1px 8px var(--sh)}
.big{width:104px;height:104px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:60px;margin:0 auto;border:4px solid var(--y);overflow:hidden}
.av img,.big img,.pl i img,.lpa img{width:100%;height:100%;object-fit:cover;display:block}
.fb{min-height:60px;font-size:30px;padding:0;background:var(--card2);box-shadow:none}.fb.on{background:var(--y)}
.st{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border-radius:18px;padding:14px 16px}.st b{color:var(--hl);font-size:20px}
.lp{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.lpa{display:inline-grid;width:38px;height:38px;border-radius:50%;place-items:center;background:var(--card2);overflow:hidden}
.rg{flex:none;width:calc(100% - 36px);margin:0 18px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:12px 16px;min-height:0;font-weight:600;box-shadow:0 1px 8px var(--sh)}
.rg b{font-size:20px}.rg span{font-size:14px;color:var(--mut);font-weight:400}.rg i{font-style:normal;font-size:14px;color:var(--hl);font-weight:700}
.rg.on{background:var(--y);color:#1d1d1d;border-color:var(--y)}.rg.on span,.rg.on i{color:#1d1d1d}
#app.g{padding:10px 10px 0;overflow:visible}
.gm{display:flex;flex-direction:column;gap:8px;min-height:calc(100dvh - 10px)}
@media (min-width:480px){.gm{min-height:calc(100dvh - 42px)}#app.g{overflow:hidden}}
.bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.bk{flex:none;width:42px;min-height:42px;padding:0;font-size:22px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;align-self:stretch;box-shadow:none}.bk.on{background:var(--cor);color:#fff;border-color:var(--cor);font-size:13px}
.pl{position:relative;flex:1 0 112px;display:flex;gap:7px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:5px 9px}
.pl.on{background:var(--y);border-color:var(--y);color:#1d1d1d}.pl.out{opacity:.35;text-decoration:line-through}
.pl i{font-style:normal;font-size:20px;width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none;border:2px solid var(--o);overflow:hidden}
.pl span{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.pl b{font-size:12px;font-weight:600;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl.on b{color:#5b4300}
.pl strong{font-size:15px;font-weight:700;line-height:1.15}
.fl{position:absolute;right:10px;top:-4px;font-style:normal;font-weight:800;font-size:16px;animation:flo 1.2s ease-out forwards;pointer-events:none;text-shadow:0 1px 0 #fff;z-index:3}
#board{display:grid;grid-template:repeat(8,1fr)/repeat(6,1fr);gap:3px;flex:1 1 auto;min-height:min(125vw,520px);max-height:640px;width:100%;padding:5px;border-radius:22px;background:var(--amber);box-shadow:0 2px 10px var(--sh)}
.c{position:relative;background:var(--tile);color:#1d1d1d;border-radius:9px;display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0;font-size:clamp(9.5px,2.8vw,12.5px);line-height:1.18;text-align:center}
.c .hd{display:flex;justify-content:space-between;align-items:center;gap:2px;white-space:nowrap;background:var(--b);color:#1d1d1d;padding:0 5px;height:18px;flex:none;font-weight:700;font-size:.95em}
.c>b{flex:1;display:flex;align-items:center;justify-content:center;padding:2px 3px 4px;overflow:hidden;font-weight:600;word-break:break-word}
.c.sp{background:var(--sp);color:var(--ink);align-items:center;justify-content:center;gap:1px}.c.sp.go{background:var(--y);color:#1d1d1d}.c.sp u{text-decoration:none;font-size:1.55em;line-height:1}.c.sp>b{flex:none;padding:0 2px}
.c.own{outline:2px solid var(--o);outline-offset:-2px}.c.cur{box-shadow:0 0 0 2px var(--ink);z-index:2}.c.cur.stp{animation:stp .25s ease}@keyframes stp{0%{transform:scale(.9)}55%{transform:scale(1.07)}100%{transform:none}}
.c.pop{animation:pop .7s ease}
.tk{display:flex}.tk em{font-style:normal;font-size:17px;line-height:1;margin-left:-5px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.c.sp .tk{margin-top:1px}.c.sp .tk em{font-size:17px;margin-left:-3px}.c.sp.tkn u{font-size:1.35em}
.tk em.me{animation:hop .5s ease}.c .hd .tk em{font-size:13px;margin-left:-4px}
#mid{grid-area:2/2/8/6;background:var(--card);color:var(--ink);border-radius:18px;margin:2px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:5px;text-align:center;min-height:0;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.who{font:600 clamp(14px,4.4vw,17px)/1.2 Prompt,Sarabun,"Noto Sans Thai",system-ui,sans-serif}
.rk{background:var(--y);color:#1d1d1d;border-radius:999px;padding:1px 12px;font-weight:600;font-size:12px}
#die{position:relative;width:clamp(84px,25vw,108px);aspect-ratio:1;background:linear-gradient(150deg,#fff 30%,#ece5d2);border:2.5px solid #1d1d1d;border-radius:24%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11%;box-shadow:0 5px 10px rgba(0,0,0,.2);flex:none;min-height:0}
#die i{border-radius:50%;margin:8%}
#die i.on{background:radial-gradient(circle at 35% 30%,#555,#111 70%)}
#die.one i.on{background:radial-gradient(circle at 35% 30%,#ff9a8a,#e5483a 70%);transform:scale(1.35)}
button#die,#die.q{display:flex;align-items:center;justify-content:center;font:800 44px/1 Prompt,sans-serif;color:#1d1d1d;padding:0;cursor:pointer}
button#die{animation:nudge 1.6s ease-in-out infinite}
#die.spin{animation:droll .9s cubic-bezier(.2,.8,.3,1)}
.rn{font-size:13px;font-weight:600;color:var(--mut);margin-top:-2px}
@keyframes droll{0%{transform:translateY(-34px) rotate(-320deg) scale(.7);opacity:.5}55%{transform:translateY(0) rotate(36deg) scale(1.1);opacity:1}78%{transform:rotate(-7deg)}100%{transform:none}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-4px) rotate(-3deg)}}
.pg{width:100%;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}.pg b{color:var(--ink);font-size:14px}
.bar2{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#ffc928,#ff9f1c);border-radius:5px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.ws{display:flex;gap:4px;justify-content:center;white-space:nowrap}.ws span{background:var(--card2);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:11.5px;text-align:left;width:100%;color:var(--mut)}.lg span{padding-left:13px;position:relative}.lg span:before{content:"";position:absolute;left:0;top:.35em;width:9px;height:9px;border-radius:50%;background:var(--b)}
.gl{font-size:11.5px;color:var(--mut)}
.fact{background:var(--card2);border-radius:12px;padding:7px 10px;font-size:12px;line-height:1.4;text-align:left;width:100%;max-height:38%;overflow:hidden}.fact p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fact b{display:block;font-size:13.5px;color:var(--hl)}.fact i{font-style:normal;font-size:12px;color:var(--mut);display:inline-block;padding-left:12px;position:relative}
.fact i:before{content:"";position:absolute;left:0;top:.35em;width:8px;height:8px;border-radius:50%;background:var(--b)}.fact p{margin:2px 0 0}
.sheet{position:sticky;bottom:0;z-index:5;margin:auto -10px 0;background:var(--sheet);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -2px 12px var(--sh);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sheet button{min-height:46px;padding:8px 12px;font-size:15.5px}.sheet .say{font-size:15px;line-height:1.4}
.logo{list-style:none;margin:0;padding:0 6px;font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.msg{background:var(--card2);border-left:5px solid var(--y);border-radius:12px;padding:8px 12px;font-size:15.5px;font-weight:500;line-height:1.35}
.pos{color:var(--pos);white-space:nowrap}.neg{color:var(--neg);white-space:nowrap}
.acts{display:flex;gap:10px;flex-wrap:wrap}.say{font-weight:700;text-align:center;width:100%}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#1d1d1d;color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin 2.6s ease forwards;white-space:nowrap}
.cf{position:fixed;top:-30px;z-index:55;pointer-events:none;animation:cf 1.9s ease-in forwards}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-10px) scale(1.25)}100%{transform:translateY(0)}}
@keyframes spin{from{transform:rotate(-360deg) scale(.4)}to{transform:none}}
@keyframes pop{0%{transform:scale(.7)}50%{transform:scale(1.15);box-shadow:0 0 0 6px rgba(255,201,40,.6)}100%{transform:none}}
@keyframes flo{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
@keyframes tin{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes cf{to{transform:translateY(112vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){button#die{animation:none}.tk em.me,#die.spin,.c.pop,.fl,.cf,.toast{animation:none}.bar2 i{transition:none}}
@media (max-height:800px){.logo{display:none}}
.dt{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 18px;padding:0 16px;box-shadow:0 1px 8px var(--sh);-webkit-user-select:text;user-select:text}
.dt summary{list-style:none;cursor:pointer;font-weight:700;font-size:17px;padding:12px 0;min-height:52px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dt summary::-webkit-details-marker{display:none}.dt summary:after{content:"+";font-weight:400;color:var(--hl);font-size:26px;line-height:1}.dt[open] summary:after{content:"−"}

.lk{background:none;border:0;box-shadow:none;color:var(--hl);text-decoration:underline;padding:4px 2px;min-height:0;flex:none;font:inherit;font-weight:700;border-radius:6px}
.lnk{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:0 18px}
.scr .note{line-height:2}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 20px),420px);z-index:20;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:4px 6px;box-shadow:0 4px 16px var(--sh)}
.nt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:none;box-shadow:none;border-radius:18px;padding:4px 2px;min-height:46px;color:var(--mut);font-size:10.5px;font-weight:600}
.nt i{font-style:normal;font-size:20px;line-height:1}.nt.on{background:var(--y);color:#1d1d1d}
.nc{flex:none;width:54px;height:54px;min-height:54px;border-radius:50%;padding:0;margin:-20px 4px 0;font-size:26px;background:var(--cy);color:var(--bi);border:4px solid var(--app);box-shadow:0 3px 8px var(--sh)}
.pill2.in{background:var(--card2);box-shadow:none;width:100%;border:0;flex:none}
.gst{align-self:center;width:auto;min-height:44px;padding:8px 26px;font-size:15px;border-width:1.5px;border-radius:999px}
button.sso{background:var(--ink);color:var(--app);min-height:56px}
.or{text-align:center;color:var(--mut);font-size:13px;margin:-4px 0}
@media (max-height:760px),(max-width:370px){
.hero{height:176px}.mas{width:132px}.ttl p,.sm{display:none}.ttl h1{font-size:38px}.scr{gap:10px}.scr>.pill2:not(.in){display:none}.box{padding:14px;gap:9px}.box .mut.sub{display:none}.tab{min-height:32px}
#die{width:clamp(66px,19vw,78px)}.who{font-size:15px}.gl,.lg{display:none}.rk{font-size:11.5px;padding:0 10px}

.sheet{padding-top:10px}.sheet button{min-height:46px;font-size:15px}.msg{font-size:15px;padding:8px 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
}
