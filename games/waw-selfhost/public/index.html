<script>
/* ตัวแทนระบบห้องออนไลน์: ทำให้เกมคุยกับเซิร์ฟเวอร์ของเราผ่าน WebSocket แทนระบบของ Claude */
(function () {
  window.__STANDALONE = true;
  function wsUrl() { return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + location.pathname.replace(/[^/]*$/, '') + 'ws'; }

  function join(name) {
    return new Promise(function (resolve, reject) {
      var st = { me: '', peers: {}, pres: {}, hp: [], hm: {}, closed: false, tries: 0, ws: null, ready: false };

      function snap() {
        return Object.keys(st.peers).map(function (id) {
          return { peer: id, by: null, isMe: id === st.me, sameTab: id === st.me, kind: 'viewer', guest: false,
                   presence: st.peers[id], updatedAt: Date.now() };
        });
      }
      function notify(ch) {
        var s = snap();
        st.hp.slice().forEach(function (f) {
          try { f({ peers: s, joined: (ch && ch.joined) || [], left: (ch && ch.left) || [], updated: (ch && ch.updated) || [] }); } catch (e) {}
        });
      }
      function only(id) { return snap().filter(function (p) { return p.peer === id; }); }

      function connect() {
        var ws = new WebSocket(wsUrl());
        st.ws = ws;
        ws.onopen = function () { ws.send(JSON.stringify({ t: 'join', room: name, presence: st.pres })); };
        ws.onmessage = function (ev) {
          var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
          if (m.t === 'joined') {
            st.me = m.peer; st.peers = {};
            m.peers.forEach(function (p) { st.peers[p.peer] = p.presence || {}; });
            st.peers[st.me] = Object.assign({}, st.pres);
            st.tries = 0;
            if (!st.ready) { st.ready = true; resolve(api); } else { notify({}); }
          } else if (m.t === 'peer') {
            var isNew = !(m.peer in st.peers);
            st.peers[m.peer] = m.presence || {};
            notify(isNew ? { joined: only(m.peer) } : { updated: only(m.peer) });
          } else if (m.t === 'left') {
            var gone = only(m.peer); delete st.peers[m.peer]; notify({ left: gone });
          } else if (m.t === 'msg') {
            (st.hm[m.topic] || []).slice().forEach(function (h) {
              try { h({ topic: m.topic, data: m.data, peer: m.peer, by: null, isMe: m.peer === st.me, sameTab: m.peer === st.me, kind: 'viewer', guest: false }); } catch (e) {}
            });
          } else if (m.t === 'error' && !st.ready) {
            reject({ code: m.code || 'not_permitted' });
          }
        };
        ws.onclose = function () {
          if (st.closed) return;
          if (!st.ready) { reject({ code: 'upstream_error' }); return; }
          if (st.tries < 6) { st.tries++; setTimeout(connect, Math.min(5000, 500 * st.tries)); }
        };
        ws.onerror = function () {};
      }

      var api = {
        name: name,
        emit: function (topic, data) {
          if (st.ws && st.ws.readyState === 1) st.ws.send(JSON.stringify({ t: 'emit', topic: topic, data: data }));
          return Promise.resolve();
        },
        on: function (topic, h) {
          (st.hm[topic] = st.hm[topic] || []).push(h);
          return function () { st.hm[topic] = (st.hm[topic] || []).filter(function (x) { return x !== h; }); };
        },
        presence: function (patch) {
          Object.keys(patch).forEach(function (k) { if (patch[k] === null) delete st.pres[k]; else st.pres[k] = patch[k]; });
          if (st.me) st.peers[st.me] = Object.assign({}, st.pres);
          if (st.ws && st.ws.readyState === 1) st.ws.send(JSON.stringify({ t: 'presence', patch: patch }));
          if (st.me) notify({ updated: only(st.me) });
          return Promise.resolve();
        },
        peers: function () { return snap(); },
        onPeers: function (h) {
          st.hp.push(h);
          return function () { st.hp = st.hp.filter(function (x) { return x !== h; }); };
        },
        connected: function () { return !!(st.ws && st.ws.readyState === 1); },
        leave: function () {
          st.closed = true;
          try { if (st.ws) { st.ws.send(JSON.stringify({ t: 'leave' })); st.ws.close(); } } catch (e) {}
          return Promise.resolve();
        },
        _drop: function () { try { st.ws.close(); } catch (e) {} } /* ใช้ทดสอบการต่อใหม่ */
      };
      connect();
    });
  }

  window.claude = {
    use: function (name) { return Promise.resolve(name === 'room' ? { join: join } : null); }
  };
})();

</script>

  s+=limb(P.la,YEL,22)+limb(P.ra,YEL,22)+limb(up(P.ll,6),CYN,24)+limb(up(P.rl,6),CYN,24);

var ACC={users:{},cur:''},LGM='in',LOCK={n:0,t:0},FG='';
function loadAcc(){try{var r=JSON.parse(localStorage.getItem('wawAcc')||'null');if(r&&r.users)ACC={users:r.users,cur:r.cur&&r.users[r.cur]?r.cur:''}}catch(e){}}
function saveAcc(){try{localStorage.setItem('wawAcc',JSON.stringify(ACC));return true}catch(e){return false}}
function isIn(){return !!(ACC.cur||(ME&&ME.id))}
function accName(){return ACC.cur&&ACC.users[ACC.cur]?ACC.users[ACC.cur].n:((ME&&ME.name)||'')}
function pkey(){return ACC.cur?'wawP:'+ACC.cur:'wawP'}
function canCrypto(){return !!(window.crypto&&crypto.subtle&&window.TextEncoder)}
function b64(buf){var a=new Uint8Array(buf),t='';for(var i=0;i<a.length;i++)t+=String.fromCharCode(a[i]);return btoa(t)}
function unb64(t){var q=atob(t),a=new Uint8Array(q.length);for(var i=0;i<q.length;i++)a[i]=q.charCodeAt(i);return a}
async function hashPw(pw,salt,it){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:it},k,256));
}
function ctEq(a,b){if(a.length!==b.length)return false;var r=0;for(var i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0}
function gv(id){var e=document.getElementById(id);return e?e.value:''}
function say(id,m,ok){var e=document.getElementById(id);if(e){e.textContent=m;e.style.color=ok?'#7BE495':''}}
function busy(id,on,t0,t1){var b=document.getElementById(id);if(b){b.disabled=on;b.textContent=on?t0:t1}}

async function afterAuth(){ME={id:null,name:'',avatarUrl:''};DB=null;await loadP();home()}
async function doReg(){
  var u=gv('lu').trim(),p=gv('lp'),p2=gv('lp2'),key=u.toLowerCase();
  if(LGM!=='reg')return;
  if(!canCrypto())return lgErr('เบราว์เซอร์นี้สร้างบัญชีที่ปลอดภัยไม่ได้ ลองทดลองเล่นแทน');
  if(u.length>60||!/^[^\s@]{1,40}@[^\s@]+\.[^\s@]{2,}$/.test(u))return lgErr('รูปแบบอีเมลไม่ถูกต้อง เช่น name@example.com');
  if(p.length<8)return lgErr('รหัสผ่านต้องมีอย่างน้อย 8 ตัว');
  if(p!==p2)return lgErr('รหัสผ่านสองช่องไม่ตรงกัน');
  if(ACC.users[key])return lgErr('อีเมลนี้สมัครไว้แล้วในเครื่องนี้ ลองเข้าสู่ระบบ');
  busy('lgs',true,'กำลังสร้างบัญชี…','');
  try{
    var salt=crypto.getRandomValues(new Uint8Array(16)),it=100000;
    ACC.users[key]={n:u.split('@')[0].slice(0,16),m:u,s:b64(salt),h:await hashPw(p,salt,it),it:it,c:Date.now()};
    try{var g=localStorage.getItem('wawP');if(g&&!localStorage.getItem('wawP:'+key))localStorage.setItem('wawP:'+key,g)}catch(e){}
    ACC.cur=key;
    if(!saveAcc()){delete ACC.users[key];ACC.cur='';return lgErr('บันทึกบัญชีไม่สำเร็จ (พื้นที่เก็บข้อมูลของเบราว์เซอร์ถูกปิดหรือเต็ม)')}
    OUT=false;try{localStorage.removeItem('wawOut')}catch(e){}
    await afterAuth();
  }catch(e){delete ACC.users[key];ACC.cur='';lgErr('สร้างบัญชีไม่สำเร็จ ลองใหม่อีกครั้ง')}
}
async function doLoc(){
  var u=gv('lu').trim().toLowerCase(),p=gv('lp');
  if(Date.now()<LOCK.t)return lgErr('ลองผิดหลายครั้ง รอ '+Math.ceil((LOCK.t-Date.now())/1000)+' วินาทีแล้วลองใหม่');
  if(!u||!p)return lgErr('กรอกอีเมลและรหัสผ่าน');
  if(!canCrypto())return lgErr('เบราว์เซอร์นี้ตรวจรหัสผ่านไม่ได้ ลองทดลองเล่นแทน');
  busy('lgs',true,'กำลังตรวจสอบ…','');
  var a=ACC.users[u],ok=false;
  try{
    if(a)ok=ctEq(await hashPw(p,unb64(a.s),a.it||100000),a.h);
    else await hashPw(p,new Uint8Array(16),100000);
  }catch(e){return lgErr('ตรวจรหัสผ่านไม่สำเร็จ ลองใหม่อีกครั้ง')}
  if(!ok){LOCK.n++;if(LOCK.n>=5){LOCK.t=Date.now()+30000;LOCK.n=0}return lgErr('อีเมลหรือรหัสผ่านไม่ถูกต้อง')}
  LOCK.n=0;ACC.cur=u;saveAcc();OUT=false;try{localStorage.removeItem('wawOut')}catch(e){}
  await afterAuth();
}
function forgot(){
  var u=gv('lu').trim().toLowerCase();
  if(!u||!ACC.users[u]){FG='';return say('lgm','พิมพ์อีเมลของคุณในช่องด้านบนก่อน แล้วกด "ลืมรหัสผ่าน?" อีกครั้ง')}
  if(FG!==u){FG=u;return say('lgm','ระบบนี้ไม่มีเซิร์ฟเวอร์จึงกู้รหัสผ่านไม่ได้ กด "ลืมรหัสผ่าน?" อีกครั้งเพื่อลบบัญชี “'+ACC.users[u].n+'” และข้อมูลทั้งหมดของบัญชีนี้ (กู้คืนไม่ได้) แล้วสมัครใหม่')}
  delete ACC.users[u];try{localStorage.removeItem('wawP:'+u)}catch(e){}
  if(ACC.cur===u)ACC.cur='';saveAcc();FG='';
  loginPage('ลบบัญชีเดิมแล้ว สมัครสมาชิกใหม่ได้เลย','reg');
}

  loginPage('ยังไม่พบบัญชี claude.ai ที่ล็อกอิน เปิดเกมจากลิงก์ที่แชร์ในบัญชี claude.ai ที่ล็อกอินอยู่ หรือสมัครบัญชีของเกมแทน');
}

function accSettings(){
  view('<div class="hd"><button class="ic" onclick="accountPage()" aria-label="กลับ">‹</button></div><h1>ตั้งค่าบัญชี</h1><p class="muted">อีเมล: <b>'+esc((ACC.users[ACC.cur]&&ACC.users[ACC.cur].m)||accName())+'</b></p>'+

   '<h2 class="sh">ลบบัญชีนี้</h2><p class="muted">ลบบัญชีและโปรไฟล์ทั้งหมดในเครื่องนี้ ย้อนกลับไม่ได้</p><input id="dp" class="in" type="password" placeholder="ใส่รหัสผ่านเพื่อยืนยัน" autocomplete="current-password"><button class="btn" id="dab" onclick="delAcc()">ลบบัญชี</button><p class="muted ctr" id="asm"></p>');

async function verifyPw(pw){var a=ACC.users[ACC.cur];if(!a||!canCrypto())return false;try{return ctEq(await hashPw(pw,unb64(a.s),a.it||100000),a.h)}catch(e){return false}}
async function chPw(){
  var o=gv('op'),n=gv('np'),n2=gv('np2');
  if(n.length<8)return say('asm','รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัว');
  if(n!==n2)return say('asm','รหัสผ่านใหม่สองช่องไม่ตรงกัน');
  busy('cpb',true,'กำลังบันทึก…','');
  if(!(await verifyPw(o))){busy('cpb',false,'','บันทึกรหัสผ่านใหม่');return say('asm','รหัสผ่านเดิมไม่ถูกต้อง')}
  try{
    var salt=crypto.getRandomValues(new Uint8Array(16)),a=ACC.users[ACC.cur];
    a.s=b64(salt);a.it=100000;a.h=await hashPw(n,salt,100000);saveAcc();
    busy('cpb',false,'','บันทึกรหัสผ่านใหม่');say('asm','เปลี่ยนรหัสผ่านแล้ว',true);
    ['op','np','np2'].forEach(function(i){var e=document.getElementById(i);if(e)e.value=''});
  }catch(e){busy('cpb',false,'','บันทึกรหัสผ่านใหม่');say('asm','เปลี่ยนรหัสผ่านไม่สำเร็จ ลองใหม่อีกครั้ง')}
}
async function delAcc(){
  busy('dab',true,'กำลังตรวจสอบ…','');
  if(!(await verifyPw(gv('dp')))){busy('dab',false,'','ลบบัญชี');return say('asm','รหัสผ่านไม่ถูกต้อง')}
  var k=ACC.cur;delete ACC.users[k];try{localStorage.removeItem('wawP:'+k)}catch(e){}
  ACC.cur='';saveAcc();OUT=true;try{localStorage.setItem('wawOut','1')}catch(e){}
  ME={id:null,name:'',avatarUrl:''};DB=null;await loadP();
  loginPage('ลบบัญชีและข้อมูลในเครื่องนี้แล้ว','reg');
}
